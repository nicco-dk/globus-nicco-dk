<!doctype html>
<html lang="da">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Siden findes ikke · Udbrudsglobus</title>
<style>
@font-face{font-family:'Archivo';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/archivo-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Archivo';font-style:normal;font-weight:700;font-display:swap;src:url('/fonts/archivo-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2')}
:root{
  --bg:#070d14; --panel:#0d1721; --fg:#e4ecf3; --fg-dim:#8ba0b4; --fg-faint:#5d7a92; --rule:#1d2d3d; --accent:#4fb3c9; --s2:#e2b443;
  color-scheme:dark;
  --display:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Consolas,monospace;
}
@media (prefers-color-scheme: light){
  :root{--bg:#e9eff4; --panel:#ffffff; --fg:#13202c; --fg-dim:#4d6276; --fg-faint:#7b8fa1; --rule:#d8e2ea; --accent:#1d7d93; --s2:#b5861c; color-scheme:light}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--display);-webkit-font-smoothing:antialiased;
  display:grid;place-items:center;padding:16px}
main{width:min(440px,100%)}
.kode{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--s2);
  border:1px solid var(--s2);border-radius:2px;padding:3px 7px;display:inline-block}
h1{font-size:26px;font-weight:700;letter-spacing:-.015em;margin:18px 0 10px}
p{font-size:15px;line-height:1.55;color:var(--fg-dim);margin:0 0 22px}
a{font-family:var(--mono);font-size:12.5px;color:var(--fg);text-decoration:none;background:var(--panel);
  border:1px solid var(--rule);border-radius:3px;padding:10px 14px;display:inline-block}
a:hover{border-color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

<main>
  <span class="kode">404</span>
  <h1>Siden findes ikke</h1>
  <p>Adressen fører ikke nogen steder hen. Udbrudsglobus ligger på forsiden.</p>
  <a href="/">Til kloden</a>
</main>
