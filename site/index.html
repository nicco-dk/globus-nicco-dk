<style>
/* Layout: mørkt instrumentpanel. Klode i midten, tidsskyder under, sidespor med søgning, trappe og hændelsesliste. */
:root{
  --ocean:#0a131c; --ocean-2:#101d29; --land:#1c2c3a; --land-line:#33506a; --border-line:#24394c;
  --bg:#070d14; --panel:#0d1721; --panel-2:#122032; --fg:#e4ecf3; --fg-dim:#8ba0b4; --fg-faint:#5d7a92;
  --rule:#1d2d3d; --accent:#4fb3c9;
  --s1:#6f93ad; --s2:#e2b443; --s3:#e8803a; --s4:#dc4a4a; --s5:#b253d8; --s0:#49796b;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
  --display:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Consolas,monospace;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --ocean:#c3d4e0; --ocean-2:#d6e3ec; --land:#f2f6f9; --land-line:#9ab0c1; --border-line:#c2d1dc;
    --bg:#e9eff4; --panel:#ffffff; --panel-2:#f3f7fa; --fg:#13202c; --fg-dim:#4d6276; --fg-faint:#7b8fa1;
    --rule:#d8e2ea; --accent:#1d7d93;
    --s1:#49708c; --s2:#b5861c; --s3:#c4601c; --s4:#c22f2f; --s5:#8c2fb0; --s0:#2f6354;
    --shadow:0 8px 24px rgba(20,40,60,.14);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --ocean:#c3d4e0; --ocean-2:#d6e3ec; --land:#f2f6f9; --land-line:#9ab0c1; --border-line:#c2d1dc;
  --bg:#e9eff4; --panel:#ffffff; --panel-2:#f3f7fa; --fg:#13202c; --fg-dim:#4d6276; --fg-faint:#7b8fa1;
  --rule:#d8e2ea; --accent:#1d7d93;
  --s1:#49708c; --s2:#b5861c; --s3:#c4601c; --s4:#c22f2f; --s5:#8c2fb0; --s0:#2f6354;
  --shadow:0 8px 24px rgba(20,40,60,.14);
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--display);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
[hidden]{display:none!important}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 362px;grid-template-rows:auto minmax(0,1fr) auto auto;
  padding:0 16px;padding-block-end:14px}
header{grid-column:1/-1;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:14px 0 11px;border-bottom:1px solid var(--rule)}
h1{font-size:19px;font-weight:700;letter-spacing:-.015em;margin:0}
.sub{font-family:var(--mono);font-size:11px;color:var(--fg-dim);letter-spacing:.02em}
.proto{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--s2);border:1px solid var(--s2);border-radius:2px;padding:3px 7px}
.stage{position:relative;min-width:0;min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas.drag{cursor:grabbing}
.hud{position:absolute;left:0;bottom:0;font-family:var(--mono);font-size:10.5px;color:var(--fg-faint);
  letter-spacing:.03em;pointer-events:none;line-height:1.7}
.zoomer{position:absolute;right:4px;bottom:4px;display:flex;flex-direction:column;gap:5px}
.zoomer button{font-family:var(--mono);font-size:13px;width:30px;height:30px;border-radius:3px;
  background:var(--panel);color:var(--fg-dim);border:1px solid var(--rule);cursor:pointer;line-height:1}
.zoomer button:hover{color:var(--fg);border-color:var(--accent)}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;gap:11px;overflow:hidden;padding-left:16px;border-left:1px solid var(--rule)}
.search{position:relative;flex:0 0 auto}
.search input{width:100%;font-family:var(--mono);font-size:12.5px;padding:9px 30px 9px 10px;border-radius:3px;
  background:var(--panel);border:1px solid var(--rule);color:var(--fg)}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.search .clr{position:absolute;right:4px;bottom:5px;background:none;border:0;color:var(--fg-faint);
  cursor:pointer;font-size:15px;line-height:1;padding:4px 6px}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--fg-faint);
  margin:0 0 7px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ladder{flex:0 0 auto;display:flex;flex-direction:column;gap:1px;border-radius:3px;overflow:hidden}
.rung{display:grid;grid-template-columns:3px 1fr auto;align-items:stretch;gap:9px;padding:0 9px 0 0;
  background:var(--panel);border:0;cursor:pointer;text-align:left;font-family:var(--display);
  color:var(--fg-dim);font-size:12.5px;width:100%;min-height:26px}
.rung .bar{background:var(--c)}
.rung .nm{align-self:center;padding:5px 0}
.rung .n{font-family:var(--mono);font-size:11.5px;color:var(--fg-faint);font-variant-numeric:tabular-nums;align-self:center}
.rung[aria-pressed="true"]{color:var(--fg);background:var(--panel-2)}
.rung[aria-pressed="false"]{opacity:.42}
.rung:hover{color:var(--fg)}
.listwrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.list{overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:1px;padding-right:2px}
.item{background:var(--panel);border:0;border-left:3px solid var(--c);padding:8px 10px;text-align:left;cursor:pointer;
  display:grid;gap:2px;color:inherit;font-family:var(--display);width:100%}
.item:hover{background:var(--panel-2)}
.item[aria-current="true"]{background:var(--panel-2);outline:1px solid var(--accent);outline-offset:-1px}
.item .t{font-size:12.5px;font-weight:600;letter-spacing:-.005em;line-height:1.25}
.item .m{font-family:var(--mono);font-size:10px;color:var(--fg-dim);letter-spacing:.02em}
.timebar{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:11px 0 0;border-top:1px solid var(--rule);margin-top:10px}
.timebar .cap{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-faint);white-space:nowrap}
.timebar input[type=range]{flex:1 1 auto;min-width:0;accent-color:var(--accent)}
.timebar .now{font-family:var(--mono);font-size:12px;color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}
.timebar button{font-family:var(--mono);font-size:10.5px;background:var(--panel);color:var(--fg-dim);border:1px solid var(--rule);
  border-radius:3px;padding:5px 9px;cursor:pointer;white-space:nowrap}
.timebar button:hover{color:var(--fg);border-color:var(--accent)}
.detail{position:absolute;left:0;top:0;width:min(340px,calc(100% - 8px));max-height:100%;overflow-y:auto;
  background:var(--panel);border:1px solid var(--rule);border-radius:4px;box-shadow:var(--shadow);padding:14px;display:grid;gap:9px}
.detail .x{position:absolute;right:6px;top:6px;background:var(--panel);border:0;color:var(--fg-faint);cursor:pointer;font-size:16px;line-height:1;padding:4px 7px}
.chip{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--c);
  border:1px solid var(--c);border-radius:2px;padding:2px 6px;justify-self:start}
.detail h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em;text-wrap:balance;padding-right:20px}
.detail .where{font-family:var(--mono);font-size:10.5px;color:var(--fg-dim)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px;border-top:1px solid var(--rule);padding-top:9px;margin:0}
.kv dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-faint);padding-top:2px}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.note{font-size:12.5px;line-height:1.5;color:var(--fg-dim);margin:0}
.tl{border-top:1px solid var(--rule);padding-top:9px;display:grid;gap:0}
.tl h3{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-faint);margin:0 0 7px}
.tlrow{display:grid;grid-template-columns:62px 1fr;gap:9px;padding:5px 0;border-left:1px solid var(--rule);padding-left:9px;margin-left:2px;position:relative}
.tlrow::before{content:"";position:absolute;left:-3.5px;top:11px;width:6px;height:6px;border-radius:50%;background:var(--d, var(--fg-faint))}
.tlrow.past::before{background:var(--d, var(--accent))}
.tlrow .dt{font-family:var(--mono);font-size:10px;color:var(--fg-faint);padding-top:1px;font-variant-numeric:tabular-nums}
.tlrow .tx{font-size:12px;line-height:1.45;color:var(--fg-dim)}
.tlrow.future{opacity:.38}
.srcs{display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--rule);padding-top:9px}
.srcs a{font-family:var(--mono);font-size:10px;color:var(--accent);text-decoration:none;border:1px solid var(--rule);
  border-radius:2px;padding:3px 6px}
.srcs a:hover{border-color:var(--accent)}
.flag{font-family:var(--mono);font-size:10px;color:var(--s2);border:1px solid var(--s2);border-radius:2px;padding:3px 6px;justify-self:start}
footer{grid-column:1/-1;font-family:var(--mono);font-size:10px;color:var(--fg-faint);letter-spacing:.02em;
  padding-top:9px;line-height:1.6}
.focusbar{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--accent);border-radius:3px;padding:6px 8px;margin-bottom:8px}
.focusbar .fname{font-size:12px;font-weight:600;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.focusbar button{font-family:var(--mono);font-size:10.5px;background:var(--panel);color:var(--fg-dim);border:1px solid var(--rule);border-radius:3px;padding:4px 8px;cursor:pointer;white-space:nowrap}
.focusbar button:hover{color:var(--fg);border-color:var(--accent)}
.item[data-dim="1"]{opacity:.45}
.curve{border-top:1px solid var(--rule);padding-top:9px}
.curve h3,.naeste h3,.cmpbox h3{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-faint);margin:0 0 6px}
.curve svg{display:block;width:100%;height:auto;overflow:visible}
.curve .cap{font-family:var(--mono);font-size:10px;color:var(--fg-faint);margin:5px 0 0;display:block}
.naeste{border-top:1px solid var(--rule);padding-top:9px}
.naeste p{margin:0;font-size:12.5px;line-height:1.5;color:var(--fg)}
.naeste .vurd{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--s2);display:block;margin-top:5px}
.addcmp{font-family:var(--mono);font-size:10px;background:none;color:var(--accent);border:1px solid var(--rule);border-radius:2px;padding:4px 7px;cursor:pointer;justify-self:start}
.addcmp:hover{border-color:var(--accent)}
.cmpbox{flex:0 0 auto;background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:9px;margin-bottom:10px}
.cmphead{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
.cmphead h3{margin:0;flex:1 1 auto}
.cmphead button{font-family:var(--mono);font-size:10px;background:none;color:var(--fg-faint);border:0;cursor:pointer;padding:0}
.cmphead button:hover{color:var(--fg)}
.cmprow{display:grid;grid-template-columns:3px 1fr 104px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--rule)}
.cmprow:first-of-type{border-top:0}
.cmprow .bar{background:var(--c);align-self:stretch;min-height:28px}
.cmprow .t{font-size:11.5px;font-weight:600;line-height:1.2}
.cmprow .v{font-family:var(--mono);font-size:10px;color:var(--fg-dim);font-variant-numeric:tabular-nums}
.cmprow svg{display:block;width:104px;height:30px}
.cmprow .x{font-family:var(--mono);font-size:11px;background:none;border:0;color:var(--fg-faint);cursor:pointer;padding:0 2px}
.srcs a.k-o{color:var(--accent)}
.srcs a.k-m{color:var(--fg-dim)}
.srcs a.k-s{color:var(--fg-faint);border-style:dashed}
.srclegend{font-family:var(--mono);font-size:9px;color:var(--fg-faint);letter-spacing:.04em;margin:6px 0 0;display:block}
.spread{border-top:1px solid var(--rule);padding-top:9px}
.spread h3{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-faint);margin:0 0 7px}
.sprow{display:grid;grid-template-columns:62px 1fr;gap:9px;font-size:11.5px;padding:3px 0;color:var(--fg-dim)}
.sprow .dt{font-family:var(--mono);font-size:10px;color:var(--fg-faint);font-variant-numeric:tabular-nums;padding-top:1px}
.spkind{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-faint);display:block}
.rels{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px solid var(--rule);padding-top:9px}
.rels button{font-family:var(--mono);font-size:10px;background:none;color:var(--accent);border:1px solid var(--rule);border-radius:2px;padding:3px 6px;cursor:pointer}
.rels button:hover{border-color:var(--accent)}
.empty{font-size:12.5px;color:var(--fg-dim);padding:14px 2px;line-height:1.5}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 54vh auto auto auto;overflow-y:auto}
  .side{padding-left:0;border-left:0;border-top:1px solid var(--rule);padding-top:12px;overflow:visible;min-height:auto}
  .list{max-height:none;overflow:visible}
  .detail{width:calc(100% - 8px)}
  .timebar{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header>
    <h1>Udbrudsglobus</h1>
    <span class="sub" id="sub"></span>
    <span class="proto">Prototypedata</span>
  </header>

  <div class="stage">
    <canvas id="c"></canvas>
    <div class="hud" id="hud"></div>
    <div class="zoomer">
      <button id="zin" title="Zoom ind" aria-label="Zoom ind">+</button>
      <button id="zout" title="Zoom ud" aria-label="Zoom ud">−</button>
      <button id="zreset" title="Nulstil visning" aria-label="Nulstil visning">⟲</button>
    </div>
    <div class="detail" id="detail" hidden></div>
  </div>

  <aside class="side">
    <div class="search">
      <label class="lbl" for="q">Søg sygdom, smittestof eller sted</label>
      <input id="q" type="search" placeholder="fx ebola, H5N1, Yersinia, Bangladesh" autocomplete="off">
      <button class="clr" id="clr" title="Ryd søgning" aria-label="Ryd søgning" hidden>×</button>
    </div>

    <div>
      <p class="lbl">Eskaleringstrin <span id="shown"></span></p>
      <div class="ladder" id="ladder"></div>
    </div>

    <div class="listwrap">
      <div class="cmpbox" id="cmpbox" hidden></div>
      <div class="focusbar" id="focusbar" hidden>
        <span class="fname" id="fname"></span>
        <button id="showall" type="button">Vis alle</button>
      </div>
      <p class="lbl">Hændelser <span id="count"></span></p>
      <div class="list" id="list"></div>
    </div>
  </aside>

  <div class="timebar">
    <span class="cap">Tidspunkt</span>
    <input id="time" type="range" min="0" max="280" value="280" step="1" aria-label="Vælg dato">
    <span class="now" id="nowlbl"></span>
    <button id="play">Afspil året</button>
    <button id="today">I dag</button>
  </div>

  <footer id="foot"></footer>

const T0 = Date.UTC(2026,0,1), T1 = pdate(DATA_DATO);
const DAY = 86400000, SPAN = Math.round((T1-T0)/DAY);
function pdate(s){

  if(p.length === 2) return `${DKM[+p[1]-1]} ${p[0]}`;

}

const DEG = Math.PI/180;
let rot = {lam:-30, phi:22}, zoom = 1, target = null;
const view = {cx:0, cy:0, R:0};
function unit(lon, lat){
  const l = (lon + rot.lam)*DEG, b = lat*DEG, p = rot.phi*DEG;

  return { x: cb*sl, y: cp*sb - sp*cb*cl, z: sp*sb + cp*cb*cl };

const scr = u => [view.cx + view.R*u.x, view.cy - view.R*u.y];
function horizon(a, b){
  const t = a.z/(a.z-b.z);
  let x = a.x+(b.x-a.x)*t, y = a.y+(b.y-a.y)*t;
  const m = Math.hypot(x,y) || 1;
  return {x:x/m, y:y/m, z:0};

function arcPts(out, a1, a2){
  let d = a2-a1;
  while(d >  Math.PI) d -= 2*Math.PI;
  while(d < -Math.PI) d += 2*Math.PI;
  const steps = Math.max(2, Math.ceil(Math.abs(d)/0.06));
  for(let i=1;i<=steps;i++){ const a = a1+d*i/steps;

  const out = []; let pendingExit = null, firstEntry = null;
  for(let i=0;i<n;i++){

      if(pendingExit !== null){ arcPts(out, pendingExit, ang); pendingExit = null; }
      out.push(scr(h));

  if(pendingExit !== null && firstEntry !== null) arcPts(out, pendingExit, firstEntry);

    const f = i/steps;
    const A = Math.sin((1-f)*d)/Math.sin(d), B = Math.sin(f*d)/Math.sin(d);
    const x = A*Math.cos(la1)*Math.cos(lo1) + B*Math.cos(la2)*Math.cos(lo2);
    const y = A*Math.cos(la1)*Math.sin(lo1) + B*Math.cos(la2)*Math.sin(lo2);
    const z = A*Math.sin(la1) + B*Math.sin(la2);
    out.push([Math.atan2(y,x)/DEG, Math.atan2(z, Math.hypot(x,y))/DEG]);
  }
  return out;
}
function drawLink(a, b, kind, col){
  const k = LK[kind] || LK.eksport;
  const pts = greatCircle([a[1],a[2]], [b[1],b[2]], 56).map(p => unit(p[0], p[1]));
  ctx.save();
  ctx.strokeStyle = k.acc ? T['--accent'] : col;
  ctx.lineWidth = k.w; ctx.globalAlpha = .85;
  if(k.dash.length){ ctx.setLineDash(k.dash); if(!reduce) ctx.lineDashOffset = -(pulse*26) % 26; }
  ctx.beginPath();
  let open = false, last = null, prev = null;
  for(const u of pts){
    if(u.z > 0){ const sp = scr(u); open ? ctx.lineTo(sp[0],sp[1]) : (ctx.moveTo(sp[0],sp[1]), open = true);
      prev = last; last = sp; }
    else open = false;
  }
  ctx.stroke(); ctx.setLineDash([]);
  if(k.arrow && last && prev){
    const ang = Math.atan2(last[1]-prev[1], last[0]-prev[0]);
    ctx.beginPath(); ctx.moveTo(last[0], last[1]);
    ctx.lineTo(last[0] - 9*Math.cos(ang-0.42), last[1] - 9*Math.sin(ang-0.42));
    ctx.lineTo(last[0] - 9*Math.cos(ang+0.42), last[1] - 9*Math.sin(ang+0.42));
    ctx.closePath(); ctx.fillStyle = ctx.strokeStyle; ctx.globalAlpha = 1; ctx.fill();
  }
  ctx.restore();
}
const fmtLat = v => Math.abs(v).toFixed(0)+'° '+(v>=0?'N':'S');
const fmtLon = v => { let x = ((v+180)%360+360)%360-180; return Math.abs(x).toFixed(0)+'° '+(x>=0?'Ø':'V'); };

// ---------- tilstand ----------
const byId = Object.fromEntries(EVENTS.map(e => [e.id, e]));
let query = '', off = new Set(), selected = null, focusId = null;
function hay(e){
  return [e.place, e.country, e.region, e.disease, e.pathogen, e.note].join(' ').toLowerCase();
}
function textMatch(e){ return !query || query.split(/\s+/).every(w => hay(e).includes(w)); }
function matches(e){ return liveAt(e, cutoff) && !off.has(stageAt(e, cutoff)) && textMatch(e); }
const listItems = () => EVENTS.filter(matches);
const visible = () => focusId
  ? (byId[focusId] && liveAt(byId[focusId], cutoff) ? [byId[focusId]] : [])
  : EVENTS.filter(matches);

// ---------- panel ----------
const ladder = document.getElementById('ladder'), list = document.getElementById('list'), detail = document.getElementById('detail');
function buildLadder(){
  ladder.innerHTML = '';
  for(const s of STAGES){
    const b = document.createElement('button');
    b.className = 'rung'; b.type = 'button'; b.style.setProperty('--c', `var(${s.v})`);
    b.title = s.d;
    b.innerHTML = `<span class="bar"></span><span class="nm"></span><span class="n"></span>`;
    b.querySelector('.nm').textContent = s.n;
    b.addEventListener('click', () => { off.has(s.k) ? off.delete(s.k) : off.add(s.k); render(); });
    ladder.appendChild(b);
  }
}
const ORDER = {mistanke:0, spredning:1, variant:2, smitte:3, udbrud:4, reservoir:5};
function render(){
  const vis = listItems();
  [...ladder.children].forEach((b,i) => {
    const s = STAGES[i];
    b.setAttribute('aria-pressed', String(!off.has(s.k)));
    b.querySelector('.n').textContent =
      EVENTS.filter(e => liveAt(e, cutoff) && stageAt(e, cutoff) === s.k && textMatch(e)).length;
  });
  document.getElementById('count').textContent = `${vis.length} af ${EVENTS.length}`;
  document.getElementById('shown').textContent = off.size ? `${STAGES.length-off.size} af ${STAGES.length} til` : '';
  list.innerHTML = '';
  if(!vis.length){
    const d = document.createElement('p'); d.className = 'empty';
    d.textContent = query ? `Ingen hændelser matcher "${query}" på det valgte tidspunkt.`
                          : 'Ingen hændelser på det valgte tidspunkt og med de valgte trin.';
    list.appendChild(d);
  }
  vis.slice().sort((a,b) => (b.live?1:0)-(a.live?1:0)
      || ORDER[stageAt(a,cutoff)]-ORDER[stageAt(b,cutoff)]
      || a.place.localeCompare(b.place,'da'))
    .forEach(e => {
      const st = stageAt(e, cutoff);
      const b = document.createElement('button');
      b.className = 'item'; b.type = 'button'; b.style.setProperty('--c', `var(${SK[st].v})`);
      b.setAttribute('aria-current', String(e.id === selected));
      if(focusId && e.id !== focusId) b.dataset.dim = '1';
      b.innerHTML = `<span class="t"></span><span class="m"></span>`;
      b.querySelector('.t').textContent = `${e.disease} · ${e.country}`;
      b.querySelector('.m').textContent = `${SK[st].n} · ${e.place}`;
      b.addEventListener('click', () => select(e.id, true));
      list.appendChild(b);
    });
  if(selected && byId[selected] && liveAt(byId[selected], cutoff)) showDetail(byId[selected]);
  draw();
}
function setFocus(id){
  focusId = id;
  const bar = document.getElementById('focusbar');
  if(id && byId[id]){
    bar.hidden = false;
    document.getElementById('fname').textContent = byId[id].disease + ' · ' + byId[id].country;
  } else bar.hidden = true;
}
let cmp = [];
function renderCmp(){
  const box = document.getElementById('cmpbox');
  if(!cmp.length){ box.hidden = true; box.innerHTML = ''; return; }
  box.hidden = false; box.innerHTML = '';
  const head = document.createElement('div'); head.className = 'cmphead';
  head.appendChild(el('h3','','Sammenligning'));
  const clr = document.createElement('button'); clr.type = 'button'; clr.textContent = 'Ryd';
  clr.addEventListener('click', () => { cmp = []; renderCmp(); if(selected && byId[selected]) showDetail(byId[selected]); });
  head.appendChild(clr); box.appendChild(head);
  for(const id of cmp){
    const e = byId[id]; if(!e) continue;
    const st = stageAt(e, cutoff);
    const r = document.createElement('div'); r.className = 'cmprow';
    r.style.setProperty('--c', 'var(' + SK[st].v + ')');
    r.appendChild(el('span','bar'));
    const mid = document.createElement('div');
    const t = el('div','t', e.disease + ' · ' + e.country); mid.appendChild(t);
    mid.appendChild(el('div','v', SK[st].n + (e.pts ? ' · ' + NUM(e.pts[e.pts.length-1][1]) : '')));
    mid.style.minWidth = '0'; mid.style.cursor = 'pointer';
    mid.addEventListener('click', () => select(id, true));
    r.appendChild(mid);
    const sp = document.createElement('div');
    sp.innerHTML = e.pts && e.pts.length > 1 ? sparkSVG(e, 104, 30, false)
      : '<span class="v">ingen talserie</span>';
    r.appendChild(sp);
    box.appendChild(r);
  }
}
function select(id, fly){
  setFocus(id);
  selected = id; const e = byId[id];
  if(fly) target = {lam:-e.lon, phi: Math.max(-80, Math.min(80, e.lat))};
  showDetail(e); render();
}
const NUM = v => v.toLocaleString('da-DK');
function sparkSVG(e, w, h, full){
  const p = e.pts; if(!p || p.length < 2) return '';
  const t0 = pdate(p[0][0]), tN = pdate(p[p.length-1][0]), span = Math.max(1, tN - t0);
  const max = Math.max.apply(null, p.map(r => r[1])) || 1;
  const padL = 3, padR = full ? 46 : 3, padT = full ? 9 : 4, padB = full ? 15 : 4;
  const X = ms => padL + (ms - t0)/span*(w - padL - padR);
  const Y = v => padT + (1 - v/max)*(h - padT - padB);
  const pts = p.map(r => [X(pdate(r[0])), Y(r[1])]);
  const line = pts.map((q,i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
  const area = line + ' L' + pts[pts.length-1][0].toFixed(1) + ' ' + (h-padB) + ' L' + pts[0][0].toFixed(1) + ' ' + (h-padB) + ' Z';
  let o = '<svg viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Udvikling i tal">';
  o += '<path d="' + area + '" fill="var(--c)" opacity=".14"/>';
  o += '<path d="' + line + '" fill="none" stroke="var(--c)" stroke-width="' + (full ? 1.7 : 1.4) + '" stroke-linejoin="round" stroke-linecap="round"/>';
  if(cutoff > t0 && cutoff < tN){
    const cx = X(cutoff).toFixed(1);
    o += '<line x1="' + cx + '" y1="' + padT + '" x2="' + cx + '" y2="' + (h-padB) + '" stroke="var(--fg-faint)" stroke-width="1" stroke-dasharray="2 3"/>';
  }
  p.forEach((r,i) => {
    const dim = pdate(r[0]) > cutoff ? '.3' : '1';
    o += '<circle cx="' + pts[i][0].toFixed(1) + '" cy="' + pts[i][1].toFixed(1) + '" r="' + (full ? 2.6 : 1.8) + '" fill="var(--c)" opacity="' + dim + '"/>';
  });
  if(full){
    const lx = pts[pts.length-1][0] + 6, ly = pts[pts.length-1][1];
    o += '<text x="' + lx.toFixed(1) + '" y="' + Math.min(Math.max(ly, padT+4), h-padB-2).toFixed(1) + '" fill="var(--fg)" font-family="' + MONO + '" font-size="10" dominant-baseline="middle">' + NUM(p[p.length-1][1]) + '</text>';
    o += '<text x="' + padL + '" y="' + (h-3) + '" fill="var(--fg-faint)" font-family="' + MONO + '" font-size="9">' + shortDate(p[0][0]) + '</text>';
    o += '<text x="' + (w-padR) + '" y="' + (h-3) + '" fill="var(--fg-faint)" font-family="' + MONO + '" font-size="9" text-anchor="end">' + shortDate(p[p.length-1][0]) + '</text>';
  }
  return o + '</svg>';
}
function el(tag, cls, text){ const n = document.createElement(tag); if(cls) n.className = cls; if(text) n.textContent = text; return n; }
function showDetail(e){
  const st = stageAt(e, cutoff), s = SK[st];
  detail.hidden = false; detail.style.setProperty('--c', `var(${s.v})`); detail.innerHTML = '';
  const x = el('button','x','×'); x.type = 'button'; x.setAttribute('aria-label','Luk');
  x.addEventListener('click', () => { selected = null; detail.hidden = true; render(); });
  const dl = document.createElement('dl'); dl.className = 'kv';
  const rows = [['Smittestof', e.pathogen], ['Omfang', e.cases], ['Startet', fmtDate(e.tl[0][0])]];
  if(e.extra) rows.push(['Detaljer', e.extra]);
  for(const [k,v] of rows){ dl.appendChild(el('dt','',k)); dl.appendChild(el('dd','',v)); }
  const tl = document.createElement('div'); tl.className = 'tl';
  tl.appendChild(el('h3','','Forløb'));
  for(const r of e.tl){
    const row = document.createElement('div');
    row.className = 'tlrow ' + (r.ms <= cutoff ? 'past' : 'future');
    if(r[2]) row.style.setProperty('--d', `var(${SK[r[2]].v})`);
    row.appendChild(el('span','dt', shortDate(r[0])));
    row.appendChild(el('span','tx', r[1]));
    tl.appendChild(row);
  }
  const sr = document.createElement('div'); sr.className = 'srcs';
  for(const [t,u] of e.src){
    const a = document.createElement('a'); a.href = u; a.target = '_blank'; a.rel = 'noopener';
    const m = /,\s*(medie|sekundær)$/.exec(t);
    a.textContent = m ? t.slice(0, m.index) : t;
    a.className = m ? (m[1] === 'medie' ? 'k-m' : 'k-s') : 'k-o';
    a.title = m ? (m[1] === 'medie' ? 'Nyhedsmedie' : 'Sekundær kilde') : 'Myndighed eller fagtidsskrift';
    sr.appendChild(a);
  }
  sr.appendChild(el('span','srclegend','Fremhævet = myndighed · dæmpet = medie · stiplet = sekundær'));
  detail.append(x, el('span','chip', s.n), el('h2','', `${e.disease} · ${e.country}`),
    el('div','where', `${e.place} · ${Math.abs(e.lat).toFixed(2)}° ${e.lat>=0?'N':'S'} ${Math.abs(e.lon).toFixed(2)}° ${e.lon>=0?'Ø':'V'}`),
    dl, el('p','note', e.note));
  if(e.pts && e.pts.length > 1){
    const cv = document.createElement('div'); cv.className = 'curve';
    cv.appendChild(el('h3','','Udvikling'));
    const holder = document.createElement('div');
    holder.innerHTML = sparkSVG(e, 300, 74, true);
    cv.appendChild(holder);
    const last = e.pts[e.pts.length-1];
    let cap = e.plabel + '. Den stiplede streg er det tidspunkt, skyderen står på.';
    if(last[2] !== null && last[2] !== undefined) cap = e.plabel + ' · seneste dødstal ' + NUM(last[2]) + ' den ' + fmtDate(last[0]) + '.';
    cv.appendChild(el('span','cap', cap));
    detail.appendChild(cv);
  }
  if(e.naeste){
    const nx = document.createElement('div'); nx.className = 'naeste';
    nx.appendChild(el('h3','','Hvad ville flytte trinnet'));
    nx.appendChild(el('p','', e.naeste));
    nx.appendChild(el('span','vurd','Vurdering, ikke kildebelagt'));
    detail.appendChild(nx);
  }
  if(e.gap) detail.appendChild(el('span','flag', 'Usikkert: ' + e.gap));
  if(e.links && e.links.length){
    const nds = e.nodes || [], sp = document.createElement('div');
    sp.className = 'spread'; sp.appendChild(el('h3','','Dokumenteret udbredelse'));
    for(const L of e.links){
      const r = document.createElement('div'); r.className = 'sprow';
      r.appendChild(el('span','dt', shortDate(L[2])));
      const w = document.createElement('span');
      w.appendChild(el('span','', (nds[L[0]] ? nds[L[0]][0] : '?') + ' til ' + (nds[L[1]] ? nds[L[1]][0] : '?')));
      w.appendChild(el('span','spkind', (LK[L[3]] || {n:L[3]}).n));
      r.appendChild(w); sp.appendChild(r);
    }
    detail.appendChild(sp);
  } else if(e.nodes && e.nodes.length > 1){
    const sp = document.createElement('div');
    sp.className = 'spread'; sp.appendChild(el('h3','','Berørte steder'));
    sp.appendChild(el('p','note', 'Kilderne dokumenterer ikke en retning mellem stederne, så der tegnes ingen linjer. Knuderne dukker op på kloden, efterhånden som tiden rykker frem.'));
    detail.appendChild(sp);
  }
  detail.append(tl, sr);
  const ac = el('button','addcmp', cmp.indexOf(e.id) >= 0 ? 'Fjern fra sammenligning' : 'Tilføj til sammenligning');
  ac.type = 'button';
  ac.addEventListener('click', () => {
    const i = cmp.indexOf(e.id);
    if(i >= 0) cmp.splice(i,1); else { cmp.push(e.id); if(cmp.length > 3) cmp.shift(); }
    renderCmp(); showDetail(e);
  });
  detail.appendChild(ac);
  if(e.rel && e.rel.length){
    const rl = document.createElement('div'); rl.className = 'rels';
    rl.appendChild(el('span','spkind','Hører sammen med'));
    for(const rid of e.rel){
      const o = byId[rid]; if(!o) continue;
      const b = document.createElement('button'); b.type = 'button';
      b.textContent = o.disease + ' · ' + o.country;
      b.addEventListener('click', () => select(rid, true));
      rl.appendChild(b);
    }
    detail.appendChild(rl);
  }
}

// ---------- interaktion ----------
let dragging = false, moved = 0, last = null, idle = performance.now();
cv.addEventListener('pointerdown', ev => { dragging = true; moved = 0; last = [ev.clientX, ev.clientY];
  cv.classList.add('drag'); cv.setPointerCapture(ev.pointerId); target = null; });
cv.addEventListener('pointermove', ev => {
  if(!dragging) return;
  const dx = ev.clientX-last[0], dy = ev.clientY-last[1];
  last = [ev.clientX, ev.clientY]; moved += Math.abs(dx)+Math.abs(dy);
  const k = 0.26/Math.max(1, zoom*0.8);
  rot.lam += dx*k; rot.phi = Math.max(-85, Math.min(85, rot.phi+dy*k));
  idle = performance.now(); draw();
});
cv.addEventListener('pointerup', ev => {
  if(dragging && moved < 5) hit(ev);
  dragging = false; cv.classList.remove('drag'); idle = performance.now();
});
cv.addEventListener('pointercancel', () => { dragging = false; cv.classList.remove('drag'); });
function hit(ev){
  const r = cv.getBoundingClientRect(), mx = ev.clientX-r.left, my = ev.clientY-r.top;
  let best = null, bd = 420;
  for(const e of visible()){
    if(!(e._sz > 0)) continue;
    const d = (e._sx-mx)**2 + (e._sy-my)**2;
    if(d < bd){ bd = d; best = e; }
  }
  if(best) select(best.id, false);
  else { selected = null; setFocus(null); detail.hidden = true; render(); }
}
cv.addEventListener('wheel', ev => { ev.preventDefault();
  setZoom(zoom*(ev.deltaY < 0 ? 1.12 : 1/1.12)); idle = performance.now(); }, {passive:false});
function setZoom(z){ zoom = Math.max(0.6, Math.min(6, z)); view.R = Math.min(W,H)/2*0.88*zoom; draw(); }
document.getElementById('zin').addEventListener('click', () => { setZoom(zoom*1.3); idle = performance.now(); });
document.getElementById('zout').addEventListener('click', () => { setZoom(zoom/1.3); idle = performance.now(); });
document.getElementById('zreset').addEventListener('click', () => { target = {lam:-30, phi:22}; setZoom(1); idle = performance.now(); });
cv.tabIndex = 0;
cv.addEventListener('keydown', ev => {
  const s = 6;
  if(ev.key === 'ArrowLeft') rot.lam -= s; else if(ev.key === 'ArrowRight') rot.lam += s;
  else if(ev.key === 'ArrowUp') rot.phi = Math.min(85, rot.phi+s);
  else if(ev.key === 'ArrowDown') rot.phi = Math.max(-85, rot.phi-s);
  else if(ev.key === '+' || ev.key === '=') setZoom(zoom*1.2);
  else if(ev.key === '-') setZoom(zoom/1.2);
  else return;
  ev.preventDefault(); target = null; idle = performance.now(); draw();
});
const q = document.getElementById('q'), clr = document.getElementById('clr');
q.addEventListener('input', () => { query = q.value.trim().toLowerCase(); clr.hidden = !q.value; render(); });
clr.addEventListener('click', () => { q.value = ''; query = ''; clr.hidden = true; q.focus(); render(); });

document.getElementById('showall').addEventListener('click', () => {
  setFocus(null); selected = null; detail.hidden = true; render();
});
window.addEventListener('keydown', ev => {
  if(ev.key === 'Escape' && focusId){ setFocus(null); selected = null; detail.hidden = true; render(); }
});

const slider = document.getElementById('time'), nowlbl = document.getElementById('nowlbl');
slider.max = String(SPAN); slider.value = String(SPAN);
function setCutoff(days){
  cutoff = T0 + days*DAY;
  const d = new Date(cutoff);
  nowlbl.textContent = `${d.getUTCDate()}. ${DKM[d.getUTCMonth()]} ${d.getUTCFullYear()}` + (days >= SPAN ? ' · i dag' : '');
  render(); renderCmp();
}
slider.addEventListener('input', () => { stopPlay(); setCutoff(+slider.value); });
let playing = null;
const playBtn = document.getElementById('play');
function stopPlay(){ if(playing){ clearInterval(playing); playing = null; playBtn.textContent = 'Afspil året'; } }
playBtn.addEventListener('click', () => {
  if(playing){ stopPlay(); return; }
  if(+slider.value >= SPAN) slider.value = '0';
  playBtn.textContent = 'Stop';
  playing = setInterval(() => {
    let v = +slider.value + 2;
    if(v >= SPAN){ v = SPAN; slider.value = String(v); setCutoff(v); stopPlay(); return; }
    slider.value = String(v); setCutoff(v);
  }, 55);
});
document.getElementById('today').addEventListener('click', () => { stopPlay(); slider.value = String(SPAN); setCutoff(SPAN); });

function tick(now){
  pulse = (now-t0p)/2200;
  let need = !reduce;
  if(target){
    let d = target.lam-rot.lam;
    while(d > 180) d -= 360; while(d < -180) d += 360;
    rot.lam += d*0.1; rot.phi += (target.phi-rot.phi)*0.1;
    if(Math.abs(d) < 0.3 && Math.abs(target.phi-rot.phi) < 0.3){ rot.lam = target.lam; rot.phi = target.phi; target = null; }
    need = true;
  } else if(!dragging && !reduce && now-idle > 5000 && !selected && !playing){ rot.lam += 0.04; need = true; }
  if(need) draw();
  requestAnimationFrame(tick);
}

document.getElementById('sub').textContent =
  EVENTS.length + ' hændelser · daterede forløb fra første tilfælde til ' + fmtDate(DATA_DATO) + ' · ' + DATA_STATUS;
document.getElementById('foot').textContent =
  'Datasæt pr. ' + fmtDate(DATA_DATO) + '. ' + EVENTS.length + ' hændelser med ' + EVENTS.reduce((n,e)=>n+e.tl.length,0) + ' daterede forløbspunkter og ' + EVENTS.reduce((n,e)=>n+(e.nodes?e.nodes.length:0),0) + ' stedknuder, sammenstillet fra WHO, ECDC, US CDC, UKHSA, PAHO, GPEI, RIVM, Statens Serum Institut, nationale myndigheder, fagtidsskrifter og nyhedsmedier. Linjer tegnes kun, hvor en kilde dokumenterer en retning. Kilder mærket medie eller sekundær er ikke myndighedsbekræftede.';

readTokens(); buildLadder(); renderCmp(); setCutoff(SPAN); resize();
window.addEventListener('resize', resize);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readTokens(); draw(); });
requestAnimationFrame(tick);
</script>
