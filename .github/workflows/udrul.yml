name: Udrul til Cloudflare Pages

# Udruller mappen site/ til Pages-projektet globus-nicco-dk, som svarer på
# https://globus.nicco.dk. Kører ved hvert commit på main, der rører site/,
# LOG.md, værktøjerne eller denne fil, og kan startes manuelt under Actions.
#
# Kører også hver time og henter maskinmeldingerne (jordskælv, storme,
# oversvømmelser, brande, hede, vulkaner og rejsevejledninger) til
# site/feeds.json, og tæller mediesporet for krig og konflikt op i
# site/konflikter.json. Den timevise kørsel udruller kun, hvis noget er ændret.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "functions/**"
      - "LOG.md"
      - "tools/tjek-data.mjs"
      - "tools/byg-log.mjs"
      - "tools/hent-feeds.mjs"
      - "tools/lande.json"
      - "tools/hent-medier.mjs"
      - "tools/hent-laes.mjs"
      - "tools/byg-ord.mjs"
      - "tools/medier.json"
      - "tools/par-tjek.json"
      - "tools/overskrifter.json"
      - "tools/ord.json"
      - "tools/byg-status.mjs"
      - "tools/tjek-status.mjs"
      - "tools/status-noegletal.mjs"
      - ".github/workflows/udrul.yml"
  # GitHub kører tidsplanen som den bruger, der sidst ændrede cron-linjen. Linjen skal derfor
  # være ændret af en rigtig GitHub-bruger (ejeren), ikke af en bot, ellers kører den ikke.
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

# Kun én udrulning ad gangen. En ny venter, til den igangværende er færdig.
concurrency:
  group: udrul
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  udrul:
    name: Kontrollér og udrul
    runs-on: ubuntu-latest
    steps:
      - name: Hent repoet
        uses: actions/checkout@v6
        with:
          # To commits, så datasættet kan sammenlignes med den forrige udgave.
          fetch-depth: 2

      # Betingelser for at siden må gå live. Fejler én, udrulles der ikke.
      - name: Kontrollér siden
        run: |
          set -euo pipefail
          if grep -RInE 'fonts\.(googleapis|gstatic)\.com' site/; then
            echo "::error::Siden henter fra Google Fonts. Skrifttyperne skal ligge i site/fonts/."
            exit 1
          fi
          if ! head -c 15 site/index.html | grep -qi '^<!doctype html>'; then
            echo "::error::site/index.html begynder ikke med doctype. Er det et fragment fra et artifact?"
            exit 1
          fi
          if ! grep -q '<meta name="viewport"' site/index.html; then
            echo "::error::site/index.html mangler viewport. Telefonlayoutet udløses ikke uden."
            exit 1
          fi
          if ! grep -qF '[hidden]{display:none!important}' site/index.html; then
            echo "::error::site/index.html mangler [hidden]-reglen. Paneler kan ikke lukkes uden."
            exit 1
          fi
          echo "Kontrol bestået."

      # Formkontrol af datasættet og sammenligning med forrige udgave.
      # Fanger blandt andet et script der ikke kan læses, manglende kilder,
      # datoer i fremtiden og hændelser der er forsvundet.
      - name: Kontrollér datasættet
        run: |
          set -euo pipefail
          if git show HEAD^:site/index.html > "$RUNNER_TEMP/forrige.html" 2>/dev/null; then
            node tools/tjek-data.mjs site/index.html --forrige "$RUNNER_TEMP/forrige.html"
          else
            node tools/tjek-data.mjs site/index.html
          fi

      # Maskinmeldingerne hentes ved hver kørsel. En kilde, der fejler, beholder
      # sine meldinger fra den udgave, der er live nu.
      - name: Hent maskinmeldinger
        run: node tools/hent-feeds.mjs site/feeds.json --forrige https://globus.nicco.dk/feeds.json

      # Mediesporet for krig og konflikt: GDELT-omtaler fra medierne på vores liste.
      # Optællingen fortsætter fra den udgave, der er live nu.
      - name: Hent mediesporet
        run: node tools/hent-medier.mjs site --forrige https://globus.nicco.dk/medier-tal.json

      # Den timevise kørsel udruller kun, når meldingerne eller stregerne er ændret.
      - name: Er meldingerne ændret?
        id: aendret
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          curl -fsS "https://globus.nicco.dk/feeds.json?v=$(date +%s)" -o "$RUNNER_TEMP/live.json" || echo '{}' > "$RUNNER_TEMP/live.json"
          curl -fsS "https://globus.nicco.dk/konflikter.json?v=$(date +%s)" -o "$RUNNER_TEMP/live-k.json" || echo '{}' > "$RUNNER_TEMP/live-k.json"
          node -e '
            const fs = require("fs");
            const kerne = (f, k) => { try { return JSON.stringify(JSON.parse(fs.readFileSync(f, "utf8"))[k] || []); } catch { return ""; } };
            const ens = kerne(process.argv[1], "h") === kerne(process.argv[2], "h") && kerne(process.argv[3], "s") === kerne(process.argv[4], "s");
            console.log(ens ? "Ingen ændringer i meldingerne. Udrulning springes over." : "Meldingerne er ændret.");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `udrul=${ens ? "nej" : "ja"}\n`);
          ' site/feeds.json "$RUNNER_TEMP/live.json" site/konflikter.json "$RUNNER_TEMP/live-k.json"

      # Den offentlige ændringslog bygges af LOG.md og ligger ikke i repoet.
      # Siden linker til den fra foden.
      - name: Byg ændringsloggen
        run: node tools/byg-log.mjs LOG.md site/log.html

      # Driftsstatus til admin.nicco.dk i den faste form nicco-status (STATUS.md i nicco-dk/projekt-nicco-dk).
      # Bygges ved hver udrulning og rører hverken EVENTS eller DATA_TID. Fejler kontrollen, udrulles der ikke.
      # Den timevise kørsel udruller kun, når meldingerne er ændret, så filen kan være et par timer gammel.
      - name: Byg driftsstatus
        run: |
          set -euo pipefail
          tid=$(grep -oP "^const DATA_TID = '\\K[^']+" site/index.html || true)
          max=$(grep -oP "^const DATA_MAX_TIMER = \\K[0-9]+" site/index.html || true)
          node tools/byg-status.mjs --site globus --spor A --ud site/status.json \
            ${tid:+--data-tid "$tid"} ${max:+--max-timer "$max"} \
            --gennemgang GENNEMGANG.md --noegletal "$(node tools/status-noegletal.mjs site)"
          node tools/tjek-status.mjs site/status.json

      # /oversaet oversætter kun tekster, hvis ord står i sidens egne filer.
      - name: Byg ordlisten til oversættelsen
        run: node tools/byg-ord.mjs site

      - name: Udrul til Pages
        if: steps.aendret.outputs.udrul != 'nej'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Konto-id er ikke en hemmelighed. Det står i enhver adresse i Cloudflares kontrolpanel.
          accountId: b8e531774d257d9555c444b444dd71b5
          command: pages deploy site --project-name=globus-nicco-dk --branch=main

  # Vagt for smittekørslen. Hver af de fire daglige kørsler sætter DATA_TID i site/index.html.
  # Er DATA_TID over 9 timer gammel, mangler mindst én kørsel, og der åbnes et issue, som
  # GitHub sender til ejeren. Issuet lukkes igen af den første kørsel, der finder DATA_TID frisk.
  vagt:
    name: Vagt for smittekørslen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Hent repoet
        uses: actions/checkout@v6
      - name: Er DATA_TID frisk?
        env:
          GH_TOKEN: ${{ github.token }}
          TITEL: "Smittekørslen er forsinket"
        run: |
          set -euo pipefail
          tid=$(grep -oP "^const DATA_TID = '\\K[^']+" site/index.html || true)
          nu=$(date +%s)
          if [ -z "$tid" ]; then echo "::warning::DATA_TID blev ikke fundet i site/index.html"; exit 0; fi
          t=$(date -d "$tid" +%s)
          timer=$(( (nu - t) / 3600 ))
          echo "DATA_TID $tid er $timer timer gammel."
          # REST, ikke gh issue, så trinnet også virker, hvor GraphQL ikke er tilgængeligt.
          aaben=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq "[.[] | select(.title == \"$TITEL\" and (.pull_request | not))][0].number // empty")
          if [ "$timer" -ge 9 ]; then
            if [ -z "$aaben" ]; then
              printf '%s\n\n%s\n\n%s\n' \
                "Seneste gennemgang af smitteudbruddene (DATA_TID) er fra $tid, $timer timer siden. Kørslerne ligger kl. 00.20, 05.20, 11.20 og 17.20 dansk tid, så mindst én kørsel er ikke gennemført." \
                "Se den planlagte opgave \"Udbrudsglobus daglig opdatering\" i Claude og den seneste post i LOG.md. Siden viser selv en advarsel i overskriftslinjen." \
                "Issuet lukkes automatisk, når en kørsel har sat DATA_TID igen." > "$RUNNER_TEMP/tekst.md"
              gh api "repos/$GITHUB_REPOSITORY/issues" -f title="$TITEL" -F body=@"$RUNNER_TEMP/tekst.md" --jq '"Issue #\(.number) åbnet."'
            else
              echo "Issue #$aaben er allerede åbent."
            fi
          elif [ -n "$aaben" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/$aaben/comments" -f body="DATA_TID er igen frisk: $tid." --silent
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$aaben" -f state=closed --jq '"Issue #\(.number) lukket."'
          fi
